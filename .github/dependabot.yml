version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to commit SHAs (see .github/workflows/ and
    # .github/actions/setup-trentorch/) rather than mutable tags, so this
    # is what keeps those pins current without hand-resolving new SHAs
    # every time an action ships a security fix.
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/TrenTorch_CLI"
    schedule:
      interval: "weekly"
    # requirements.txt is a pip-compile --generate-hashes lockfile compiled
    # from requirements.in (the human-edited source of version floors:
    # NumPy, Jupyter, Jupytext, nbdev, Rich, PyYAML, pytest, etc.);
    # pyproject.toml's own dependency list mirrors requirements.in.
    # Dependabot's pip support understands hash-pinned requirements files
    # directly -- it rewrites both the version and the hash in the same PR
    # when it bumps a dependency, so this is what keeps requirements.txt's
    # hashes current without anyone hand-running pip-compile for routine
    # bumps (only adding/removing a dependency in requirements.in needs
    # that by hand). Also what catches a CVE in either file without
    # someone noticing by hand.
    # "chore" (not "deps"): the semantic-pull-request title check's
    # allowed types don't include "deps", so a "deps:" prefix here fails
    # title-check on every pip Dependabot PR.
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/TrenTorch_Web"
    schedule:
      interval: "weekly"
    # Web dependency bumps belong on the Web line. Without this they open
    # against the default branch (TrenTorch-Dev, the CLI line), which is
    # where the github-actions and pip updates above correctly go. Security
    # updates ignore target-branch and still open against the default branch.
    target-branch: "TrenTorch-Web-Dev"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      # shadcn-svelte/bits-ui and friends bump in lockstep upstream far
      # more often than any single package here actually needs a review
      # on its own -- one grouped PR per week beats a dozen individual
      # ones for a UI-component stack this size.
      radix-ui:
        patterns:
          - "bits-ui"
          - "@lucide/svelte"
