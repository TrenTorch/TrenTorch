name: CodeQL

# Static analysis for real security bugs (injection, unsafe deserialization,
# path traversal, etc.), not style. Free for public repos, and this repo
# is public. Runs on every push to main or dev, every PR, and weekly so a query
# pack update can surface something in code that didn't change.
#
# Matrix covers both halves of the monorepo: python (TrenTorch_CLI) and
# javascript-typescript (TrenTorch_Web). Each language's own analysis only
# ever finds things in that language's files regardless of what else
# changed, so there's no real cost to always running both rather than
# path-scoping per language.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '17 3 * * 1'  # Mondays, off-peak, offset from other scheduled jobs
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to the one job that actually needs it, not the whole workflow
    # (OpenSSF Scorecard's Token-Permissions check flags workflow-level
    # write access even when there's currently only one job, since a
    # future job added without its own narrower permissions would
    # silently inherit it).
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        # Only the python leg needs a real build step (trentorch's package
        # export); javascript-typescript's CodeQL extractor works directly
        # off source, no build required.
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"
