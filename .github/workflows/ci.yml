name: CI

# Lint, type-check, test, and build -- gated behind a path filter so a
# docs-only or workflow-only PR doesn't pay for a full Node install +
# build. Golden-path smoke tests run static HTML checks against the real
# build/ output instead of a real browser (see
# TrenTorch_Web/e2e/golden-paths.spec.ts for why), so they're cheap
# enough to just run inline below rather than needing a separate
# nightly/on-demand workflow.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'TrenTorch_Web/platform/**'
              - 'TrenTorch_Web/processes/**'
              - 'TrenTorch_Web/data/**'
              - 'TrenTorch_Web/supabase/**'
              - 'TrenTorch_Web/static/**'
              - 'TrenTorch_Web/package.json'
              - 'TrenTorch_Web/package-lock.json'
              - 'TrenTorch_Web/.config/**'
              - 'TrenTorch_Web/svelte.config.js'
              - 'TrenTorch_Web/tsconfig.json'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # All app code/config lives under TrenTorch_Web/ now (.github/
        # itself didn't move -- GitHub only discovers workflows at the
        # true repo root). Only affects `run:` steps.
        working-directory: TrenTorch_Web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: TrenTorch_Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type check
        # $env/static/public needs PUBLIC_SUPABASE_URL/ANON_KEY to resolve
        # to *some* string at build/check time -- .env.test's fake values
        # satisfy that with zero real credentials anywhere in CI. Nothing
        # here makes a network call, so a fake, unreachable URL is correct,
        # not a stand-in for one that should be real.
        run: npx dotenvx run -f .env.test -- npm run check

      - name: Unit + component + migration regression tests
        run: npx dotenvx run -f .env.test -- npm run test

      - name: Build
        run: npx dotenvx run -f .env.test -- npm run build

      - name: Golden-path smoke tests
        # Static-HTML checks against build/ output, not a real browser --
        # see e2e/golden-paths.spec.ts for why. Runs after Build since it
        # reads the build/ directory that step produces.
        run: npm run test:smoke
