name: CI

# Lint, type-check, test, and build on every push/PR to main or dev. No
# paths-ignore: this is a single small SvelteKit app, not worth the
# required-check path-filter footgun for what's currently a fast job.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Referenced via $env/static/public (processes/auth/supabase-client.ts)
      # -- svelte-check and the build both fail outright if these aren't set,
      # since a static public env import with no matching value isn't a
      # missing-at-runtime value, it's a missing export at build time.
      # Public-safe by design: the publishable/anon key is meant to ship in
      # client bundles, real access control lives in Supabase's RLS policies.
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
