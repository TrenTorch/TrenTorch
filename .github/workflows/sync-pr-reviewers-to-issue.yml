name: 'Sync PR Reviewers onto the Linked Issue'

# GitHub issues have no real "reviewers" concept -- only PRs do -- so the
# project board can't reflect "who's reviewing the work on this issue"
# through any built-in field. This copies the linked PR's requested
# reviewers into a custom "PR Reviewers" text field on the issue's own
# project card instead, whenever the PR's reviewer list changes (or the
# PR is opened/edited/synced, in case that's what created the link in the
# first place).
#
# Only ever touches an issue that's both actually linked via a real
# closing keyword (closingIssuesReferences -- see the no-op case below for
# what "real" means here) AND already has a card on the TrenTorch-Web
# project board; an issue that isn't on the board is left alone, since
# there's no card to write the field onto.
#
# Needs AUTOFIX_PAT: GITHUB_TOKEN can't write Projects (v2) fields at all,
# same reason interaction-limits and the other bot jobs in this repo need
# a real PAT instead.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, review_requested, review_request_removed]

permissions:
  contents: read
  pull-requests: read

env:
  # TrenTorch-Web's project board (github.com/orgs/TrenTorch/projects/1).
  PROJECT_ID: PVT_kwDOE0bums4BiywJ

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check AUTOFIX_PAT is configured
        id: has-pat
        run: |
          if [ -z "${{ secrets.AUTOFIX_PAT }}" ]; then
            echo "::notice::AUTOFIX_PAT secret isn't set yet -- skipping reviewer sync. The linked issue's PR Reviewers field won't update until it's added."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync reviewers onto every issue this PR closes
        if: steps.has-pat.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          # closingIssuesReferences already applies GitHub's own rules for
          # what counts as a real link (recognized keyword, PR targets the
          # default branch) -- nothing to re-derive here.
          pr_data=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 25) { nodes { number } }
                  reviewRequests(first: 25) {
                    nodes { requestedReviewer { ... on User { login } } }
                  }
                }
              }
            }' -F owner="$OWNER" -F repo="$REPO" -F number="$PR_NUMBER")

          reviewers=$(echo "$pr_data" | jq -r '
            [.data.repository.pullRequest.reviewRequests.nodes[].requestedReviewer.login // empty]
            | join(", ")')
          issue_numbers=$(echo "$pr_data" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          if [ -z "$issue_numbers" ]; then
            echo "PR #$PR_NUMBER doesn't close any issue via a recognized keyword -- nothing to sync."
            exit 0
          fi

          # Look the field up by name each run rather than hardcoding its
          # id, so this keeps working even if the field gets deleted and
          # recreated on the board.
          field_id=$(gh api graphql -f query='
            query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  field(name: "PR Reviewers") { ... on ProjectV2FieldCommon { id } }
                }
              }
            }' -F project="$PROJECT_ID" --jq '.data.node.field.id')

          if [ -z "$field_id" ] || [ "$field_id" = "null" ]; then
            echo "::warning::No 'PR Reviewers' field on the project -- nothing to sync onto."
            exit 0
          fi

          for issue_number in $issue_numbers; do
            # `gh api --jq` doesn't accept `--arg` (it only takes a filter
            # string, not real jq's flags), so the project-id comparison
            # has to happen in a second, actual `jq` instead of inline.
            item_id=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 10) { nodes { id project { id } } }
                  }
                }
              }' -F owner="$OWNER" -F repo="$REPO" -F number="$issue_number" \
              | jq -r --arg project "$PROJECT_ID" \
                '.data.repository.issue.projectItems.nodes[] | select(.project.id == $project) | .id')

            if [ -z "$item_id" ]; then
              echo "Issue #$issue_number isn't on the project board -- skipping."
              continue
            fi

            echo "Setting PR Reviewers = \"$reviewers\" on issue #$issue_number"
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { text: $value }
                }) {
                  projectV2Item { id }
                }
              }' -F project="$PROJECT_ID" -F item="$item_id" -F field="$field_id" -F value="$reviewers" > /dev/null
          done
