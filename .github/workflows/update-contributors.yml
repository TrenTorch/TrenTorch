name: 'Update Contributors Table'

# Recomputes README.md's "Team Engineers" and "Open-Source Contributors"
# avatar grids from the real GitHub API each time a PR is merged into
# TrenTorch-Dev, and opens+merges a PR if the result changed. Only people
# with a merged PR get a spot; a rejected/closed-without-merging PR earns no
# credit, and neither does raising an issue alone.
#
# It fires on merged PRs only, not on every issue/PR open/close event, which
# was noisy in the past. A short burst of merges queues up behind the
# concurrency group below, and each run recomputes from the API, so the runs
# after the first find nothing to change and open no PR.
#
# It runs on pull_request_target, not pull_request, because a PR from a fork
# gets no repo secrets under pull_request and this job needs AUTOFIX_PAT.
# That is safe here because the job never checks out or runs the PR's code:
# it checks out TrenTorch-Dev, and nothing from the PR (title, branch name,
# body) is used in a shell command.
#
# A direct push to main (no PR at all) was tried and doesn't work: main's
# branch protection rejects it for GITHUB_TOKEN specifically ("GH006:
# Protected branch update failed... Changes must be made through a pull
# request"), confirmed by a live test run, not assumed. Only accounts with
# admin bypass privilege (like the repo owner's own account) can push
# directly; the bot's default token isn't one of those, and weakening branch
# protection to grant it that, or pushing under a stored personal token
# instead, are both real trade-offs to make deliberately, not a side effect
# of "make CI quieter". So this still goes through a PR + auto-merge, which
# already works end to end (a PR merge satisfies the "must go through a
# pull request" rule the way a raw push doesn't).
#
# The PR-open step used the default GITHUB_TOKEN and failed every single
# run with "GitHub Actions is not permitted to create or approve pull
# requests" (confirmed live, run 33566852709: the org/repo setting that
# allows Actions to open PRs with its own token is off, same restriction
# autofix.yml and changelog-backfill.yml already work around). The branch
# still got pushed before that step failed, so it never got a PR and never
# got auto-deleted -- left as orphaned clutter. Switched to AUTOFIX_PAT,
# the same fine-grained PAT those two bots use, so PR creation actually
# succeeds; no-ops cleanly if the secret isn't set, same as they do.

on:
  pull_request_target:
    types: [closed]
    branches: [TrenTorch-Dev]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read

# Runs one at a time, so a burst of merges queues instead of racing to push
# the same README change.
concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update-contributors:
    # Only a merged PR counts. Skip the bot's own update PRs so merging one
    # doesn't trigger another run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'update-contributors-'))
    runs-on: ubuntu-latest
    steps:
      - name: Check AUTOFIX_PAT is configured
        id: has-pat
        run: |
          if [ -z "${{ secrets.AUTOFIX_PAT }}" ]; then
            echo "::notice::AUTOFIX_PAT secret isn't set yet -- skipping contributors update. Actions' default token can't open PRs in this repo."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.has-pat.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: TrenTorch-Dev
          token: ${{ secrets.AUTOFIX_PAT }}

      # Regression guard: this script's regex parser silently wiped every
      # real name/bio back to raw logins once already (the role line broke
      # its own "find the existing intro" pattern). Fails loudly here
      # instead of writing bad data to README.md again.
      - name: Selftest the parser before touching README.md
        if: steps.has-pat.outputs.configured == 'true'
        run: |
          python3 .github/scripts/update_contributors.py --selftest

      - name: Run update script
        if: steps.has-pat.outputs.configured == 'true'
        id: update
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT }}
        run: |
          python3 .github/scripts/update_contributors.py

      - name: Check for changes
        if: steps.has-pat.outputs.configured == 'true'
        id: diff
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and merge update PR
        if: steps.has-pat.outputs.configured == 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT }}
        run: |
          BRANCH="update-contributors-$(date +%s)"
          git config user.name "trentorch-bot"
          git config user.email "trentorch-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "Update contributors sections"
          git push origin "$BRANCH"
          gh pr create --title "Update contributors sections" \
            --body "Automated update after a merged PR. See .github/workflows/update-contributors.yml." \
            --base TrenTorch-Dev --head "$BRANCH"
          gh pr merge "$BRANCH" --merge --admin --delete-branch || \
            echo "::warning::Could not auto-merge, left open for manual merge."
