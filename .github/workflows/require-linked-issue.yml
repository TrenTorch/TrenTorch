name: 'Require a Linked, Assigned Issue for External PRs'

# Enforces the contribution workflow this repo wants from first-time/
# external contributors: open an issue describing the problem, get it
# assigned to you, *then* open a PR that references it (e.g. "Fixes #123"
# in the description). Known collaborators (author_association OWNER/
# MEMBER/COLLABORATOR) are exempt -- this targets drive-by PRs from people
# outside the existing team, not the team's own normal workflow.
#
# pull_request_target, not pull_request, matching this repo's other
# metadata-only bots (pr-auto-assign.yml, welcome.yml): this only reads
# PR text/author and comments/labels via the API. It never checks out or
# runs any code from the PR branch itself.
#
# Deliberately non-blocking: comments + labels `needs-linked-issue` rather
# than closing the PR outright, so a maintainer still makes the actual
# call (a false positive here -- e.g. a legitimate PR that just forgot the
# magic words -- shouldn't get auto-closed on a first contribution).

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    # Skip the repo's own team and bots (Dependabot, this repo's other
    # automation) -- this is aimed at contributors the maintainers haven't
    # already vetted through issue triage, not routine team/bot PRs.
    if: |
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    steps:
      - name: Check for a linked, assigned issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = "needs-linked-issue";
            const body = context.payload.pull_request.body || "";
            const author = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            // GitHub's own closing-keyword syntax: Fixes/Closes/Resolves #N
            // (any tense/number GitHub itself recognizes for auto-close).
            const closingKeywordRe = /\b(close[sd]?|fixe?[sd]?|resolve[sd]?)\s+#(\d+)\b/gi;
            const matches = [...body.matchAll(closingKeywordRe)];

            async function flag(message) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [LABEL],
              });
              // This runs on every edit of the PR, so keep one comment and
              // update it in place instead of adding a new one each time.
              const MARKER = "<!-- linked-issue-check -->";
              const commentBody = `${MARKER}\n${message}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const existing = comments.find((c) => (c.body || "").includes(MARKER));
              if (existing) {
                if (existing.body !== commentBody) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: commentBody,
                  });
                }
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

            async function unflag() {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: LABEL,
                });
              } catch (e) {
                // Label wasn't present -- nothing to remove, not an error.
              }
            }

            const HOW_IT_WORKS =
              "Here is how contributions work: raise an issue (what is wrong, how to recreate it, " +
              "how big it is), describe your approach and ask a maintainer whether it is correct, " +
              "and once a maintainer approves it and assigns the issue to you, open the PR " +
              "referencing it (for example `Fixes #123`). See the " +
              "[contributing guide](https://github.com/TrenTorch/TrenTorch/blob/TrenTorch-Dev/TrenTorch_CLI/docs/CONTRIBUTING.md).";

            if (matches.length === 0) {
              await flag(
                "Thanks for the PR! It doesn't reference an issue yet.\n\n" +
                HOW_IT_WORKS + "\n\n" +
                "Could you open an issue for this (if one doesn't exist yet), ask to be assigned " +
                "once a maintainer approves your approach, and add `Fixes #<issue-number>` to this " +
                "PR's description? A maintainer can also link an existing issue for you."
              );
              return;
            }

            let assignedToAuthor = false;
            let assignedToSomeoneElse = false;
            for (const m of matches) {
              const issueNumber = parseInt(m[2], 10);
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                const assignees = (issue.assignees || []).map((a) => a.login);
                if (assignees.includes(author)) {
                  assignedToAuthor = true;
                  break;
                }
                if (assignees.length > 0) assignedToSomeoneElse = true;
              } catch (e) {
                // Referenced issue number doesn't exist: treat like unlinked.
              }
            }

            if (assignedToAuthor) {
              await unflag();
              return;
            }

            if (assignedToSomeoneElse) {
              await flag(
                "This PR references an issue that is assigned to someone else. An assigned issue is " +
                "taken, and opening a PR for it is not allowed: the maintainers may block " +
                "contributors who take another person's assigned issue.\n\n" +
                "If the assignee has gone quiet, comment on the issue and ask. An issue with no PR " +
                "for 3 days after assignment is unassigned automatically. A maintainer will decide " +
                "what happens to this PR."
              );
              return;
            }

            await flag(
              "Thanks for the PR! This references an issue, but it isn't assigned to you yet.\n\n" +
              HOW_IT_WORKS + "\n\n" +
              "Please describe your approach on the issue and ask a maintainer to confirm it and " +
              "assign the issue to you. A maintainer will review this PR after that."
            );
