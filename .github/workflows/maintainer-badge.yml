name: 'Badge Maintainer, Principal Maintainer and Core Engineer PRs and Issues'

# GitHub's own comment/PR author badge (author_association) is a fixed
# set -- OWNER/MEMBER/COLLABORATOR/CONTRIBUTOR/NONE -- with no
# "Principal Maintainer" or "Core Engineer" option, and that's not
# something any repo or org setting can change. Labels are the closest
# real, visible equivalent: this tags every PR/issue the moment it's
# opened with whichever of these two applies to its author.
#
# The titles match the ones in README.md's "Team Engineers" section:
# - "Principal Maintainer" is the project lead, one named account
#   (PROJECT_LEAD_LOGIN below).
# - "Maintainer" is permission-derived: anyone else who holds Maintain or
#   Admin, checked live via the API, so it stays correct as the team
#   changes.
# - "Core Engineer" is a named-person title, not a permission tier GitHub
#   exposes, so that one is a plain username list.
# Keep PROJECT_LEAD_LOGIN and CORE_ENGINEERS in sync with the same two
# values in .github/scripts/update_contributors.py. An earlier version gave
# every Maintain/Admin account the "Principal Maintainer" label, which
# disagreed with the README.

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.sender.type != 'Bot'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PRINCIPAL_MAINTAINER_LABEL = "Principal Maintainer";
            const MAINTAINER_LABEL = "Maintainer";
            const CORE_ENGINEER_LABEL = "Core Engineer";
            const PROJECT_LEAD_LOGIN = "Shashank-Tripathi-07";
            const CORE_ENGINEERS = new Set(["yashanand12ssdn-ops"]);

            const isIssue = !!context.payload.issue;
            const item = isIssue ? context.payload.issue : context.payload.pull_request;
            const author = item.user.login;
            const number = item.number;

            const labelsToAdd = [];

            if (author === PROJECT_LEAD_LOGIN) {
              labelsToAdd.push(PRINCIPAL_MAINTAINER_LABEL);
            } else if (CORE_ENGINEERS.has(author)) {
              labelsToAdd.push(CORE_ENGINEER_LABEL);
            } else {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              if (perm.role_name === "maintain" || perm.role_name === "admin") {
                labelsToAdd.push(MAINTAINER_LABEL);
              } else {
                console.log(`${author} has role "${perm.role_name}" and isn't in CORE_ENGINEERS, so no badge.`);
              }
            }

            if (labelsToAdd.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: labelsToAdd,
            });
            console.log(`Labeled #${number} (${author}): ${labelsToAdd.join(", ")}`);
