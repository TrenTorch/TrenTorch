<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" role="img" aria-labelledby="t d">
<title id="t">Climbing toward a red star while the crowd says you can’t</title>
<desc id="d">A stick figure made of stars climbs a constellation mountain carrying a red lantern toward a glowing red star on the summit. At the foot of the mountain four small figures say “you can’t”, “it’s out of fashion”, “give up” and “it won’t work”. A faint neural network of stars hangs in the sky. Caption: Neural networks were out of fashion for decades. Geoffrey Hinton kept training them anyway, and later shared a Nobel Prize for it. You don’t need to follow the trend. Believing in your intuition is what it takes.</desc>
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5555" stop-opacity=".95"/><stop offset=".35" stop-color="#d33a3a" stop-opacity=".45"/><stop offset="1" stop-color="#d33a3a" stop-opacity="0"/></radialGradient>
</defs>
<style>
.tw{} .pulse{} .bub{}
@media (prefers-reduced-motion:no-preference){
.tw{animation:tw 5s ease-in-out infinite}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bub{animation:bb 6s ease-in-out infinite}
}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes pl{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.22)}}
@keyframes bb{0%,100%{opacity:.55}50%{opacity:1}}
.cap{font-family:'Caveat','Kalam',Georgia,'Times New Roman',serif;font-style:italic;fill:#8d8d8d}
.capl{font-size:17px}
</style>

