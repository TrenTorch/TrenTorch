<!-- caption -->
<text class="cap capl" x="480" y="376" text-anchor="middle">Neural networks were out of fashion for decades.</text>
<text class="cap capl" x="480" y="400" text-anchor="middle">Geoffrey Hinton kept training them anyway, and later shared a Nobel Prize for it.</text>
<text class="cap capl" x="480" y="424" text-anchor="middle">You don’t need to follow the trend. Believing in your intuition is what it takes.</text>
