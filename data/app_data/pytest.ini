[pytest]
# Every question's tests live in a file literally named `tests.py`
# (not test_*.py) -- keeps each question folder self-describing
# without a numeric/slug-prefixed test filename. This override makes
# `pytest data/` discover them recursively; running `pytest
# path/to/question/tests.py` directly always worked regardless.
python_files = tests.py

# Every question folder has no __init__.py (question folders aren't
# Python packages), and every one names its test file identically
# (tests.py) -- pytest's default "prepend" import mode imports the
# first one as top-level module `tests`, then errors on every other
# folder's tests.py as a basename collision. importlib mode imports
# each by its actual file path instead of a synthesized module name,
# so identical basenames across different folders never collide.
addopts = --import-mode=importlib
